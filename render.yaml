services:
  - type: web
    name: trinity-billet-inventory
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: TRINITY_RESEND_API_KEY
        sync: false
      - key: TRINITY_INTERNAL_EMAIL_FROM
        sync: false
      - key: TRINITY_INTERNAL_EMAIL_REPLY_TO
        sync: false
      - key: TRINITY_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: TRINITY_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TRINITY_GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: TRINITY_GOOGLE_INTERNAL_EMAIL_FROM
        sync: false
      - key: TRINITY_GOOGLE_OAUTH_REDIRECT_URI
        value: https://trinity-billet-inventory.onrender.com/api/internal-email/google/callback
      - key: TRINITY_INTERNAL_EMAIL_ALLOWED_DOMAINS
        value: trinitybats.com
      - key: SHOPIFY_API_VERSION
        value: 2026-01
      - key: TRINITY_DRAFT_SHIPPING_TITLE
        value: Standard Shipping
      - key: TRINITY_DRAFT_SHIPPING_FAST_TITLE
        value: Fast Shipping
      - key: TRINITY_DRAFT_SHIPPING_REALLY_FAST_TITLE
        value: Really Fast Shipping
      - key: TRINITY_DRAFT_SHIPPING_COMPED_TITLE
        value: Comped Shipping
      - key: TRINITY_RUSH_PRODUCTION_TITLE
        value: Rush Production Surcharge
      - key: TRINITY_RUSH_PRODUCTION_AMOUNT
        value: '50.00'
  - type: web
    name: trinity-analytics-collector
    runtime: docker
    dockerfilePath: ./Dockerfile.analytics
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SHOPIFY_SHOP
        sync: false
      - key: TRINITY_ANALYTICS_SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-01
      - key: SHOPIFY_CURRENCY_CODE
        value: USD
      - key: TRINITY_ANALYTICS_ALLOWED_ORIGINS
        value: '*'
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_API_SECRET
        sync: false
